const WX=Object.fromEntries(Object.entries(XR).map(([n,a])=>['x'+n,a.map(([q,o,k])=>[q,o,k,`Extra questions from PPT, week ${n}.`])]));
const WK={[LG]:WL,[PS]:{...W,...WX},[MH]:WMH};let CS=PS;
const app=document.getElementById('app'),TOTAL=180*60;
let Q,ans,cur,end,iv,sub,name,taken,lv=false;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,s);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`};
function picker(sn){
 CS=sn;const WW=WK[sn];
 app.innerHTML=`<h1>${sn}</h1><p class="sub">Select the weeks to include. Questions from the chosen weeks are mixed and shuffled. 180 minutes.</p><h2 style="font-size:1.1rem;margin:20px 0 10px">Assignment questions</h2><div class="grid">`+Object.keys(WW).map(n=>`${n==='x1'?'</div><h2 style="font-size:1.1rem;margin:24px 0 10px">Extra questions from PPT</h2><div class="grid">':''}<label class="card"><input type="checkbox" value="${n}" ${WW[n].length?'':'disabled'}> <b style="display:inline">Week ${n[0]==='x'?n.slice(1)+' (extra)':n}</b><br><span>${WW[n].length?`${WW[n].length} question${WW[n].length>1?'s':''}`:'Coming soon'}</span></label>`).join('')+`</div><div class="row"><button class="btn ghost" id="a">Select all</button><button class="btn ghost" id="c">Clear</button><button class="btn ghost" id="b">Back</button><button class="btn" id="g" disabled>Start test</button></div><p class="mu" id="m"></p>`;
 const cb=[...app.querySelectorAll('input')],g=document.getElementById('g');
 const up=()=>{const k=cb.filter(x=>x.checked);g.disabled=!k.length;document.getElementById('m').textContent=k.length?`${k.length} week(s) · ${k.reduce((t,x)=>t+WW[x.value].length,0)} questions selected`:''};
 cb.forEach(x=>x.onchange=up);
 document.getElementById('a').onclick=()=>{cb.forEach(x=>x.checked=!x.disabled);up()};
 document.getElementById('c').onclick=()=>{cb.forEach(x=>x.checked=false);up()};
 document.getElementById('b').onclick=home;
 g.onclick=()=>{const k=cb.filter(x=>x.checked).map(x=>x.value);SRC=k.flatMap(n=>WW[n]);start(`${sn} (Week ${k.map(n=>n[0]==='x'?n.slice(1)+' extra':n).join(', ')})`)};
}
function home(){
 clearInterval(iv);
 app.innerHTML=`<h1>MCQ Timed Test</h1><p class="sub">Choose a subject. You get 180 minutes. Question order is shuffled every time, and you can submit any time.</p><div class="grid">`+
 Object.keys(D).map(k=>`<button class="card" data-s="${k}"><b>${k}</b><span>${D[k].length} questions · 180 min</span></button>`).join('')+`<button class="card" data-s="${LG}"><b>${LG}</b><span>12 weeks · pick any weeks · 180 min</span></button><button class="card" data-s="${PS}"><b>${PS}</b><span>12 weeks · pick any weeks · 180 min</span></button><button class="card" data-s="${MH}"><b>${MH}</b><span>12 weeks · pick any weeks · 180 min</span></button></div>`;
 app.querySelectorAll('.card').forEach(b=>b.onclick=()=>WK[b.dataset.s]?picker(b.dataset.s):start(b.dataset.s));
}
function start(s){
 name=s;
 Q=sh(D[s]||SRC).map(([q,o,a,e])=>{const m=sh(o.map((t,i)=>[t,i]));return{q,o:m.map(x=>x[0]),a:m.findIndex(x=>x[1]===a),e}});

 clearInterval(iv);iv=setInterval(tick,500);render();
}
function left(){return Math.round((end-Date.now())/1000)}
function tick(){
 const l=left(),t=document.getElementById('t');
 if(l<=0){submit();return}
 if(t){t.textContent=fmt(l);t.classList.toggle('low',l<300)}
}
function render(){
 const q=Q[cur],all=ans.every(x=>x!==null),n=ans.filter(x=>x!==null).length;
 app.innerHTML=`<div class="hd"><div><button class="btn ghost" id="bk" style="padding:4px 12px;margin-bottom:6px">← Back</button><div><b>${name}</b></div><div class="mu">${n} of ${Q.length} answered</div></div><div class="tm" id="t">${fmt(left())}</div></div>${lv?`<div class="sb"><b>Leave this test?</b><div class="mu">Your answers so far will be lost and the timer will stop.</div><div class="row"><button class="btn" id="ly">Leave</button><button class="btn ghost" id="ls">Stay</button></div></div>`:''}
 <div class="mu" style="margin-top:16px">Question ${cur+1} of ${Q.length}</div><div class="q">${q.q}</div>`+

 `<div class="row"><button class="btn ghost" id="p" ${cur===0?'disabled':''}>Previous</button><button class="btn ghost" id="n" ${cur===Q.length-1?'disabled':''}>Next</button></div>
 <div class="pal">${Q.map((_,i)=>`<button data-i="${i}" class="${ans[i]!==null?'done':''}${i===cur?' cur':''}">${i+1}</button>`).join('')}</div>`+
 `<div class="sb"><b>${all?'All questions answered.':`${Q.length-n} unanswered.`}</b><div class="mu">You can still change answers before submitting.</div><div class="row"><button class="btn" id="s">Submit test</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.k;render()});
 app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
 document.getElementById('p').onclick=()=>{cur--;render()};
 document.getElementById('n').onclick=()=>{cur++;render()};
 const s=document.getElementById('s');if(s)s.onclick=()=>submit();
 document.getElementById('bk').onclick=()=>{lv=true;render()};

}
function submit(){
 if(sub)return;sub=true;clearInterval(iv);taken=TOTAL-Math.max(0,left());
 const sc=Q.filter((q,i)=>ans[i]===q.a).length,p=Math.round(sc/Q.length*100),skipped=ans.filter(x=>x===null).length;
 app.innerHTML=`<h1>Results</h1><div class="mu">${name}</div><div class="big">${sc} / ${Q.length}</div>
 <p class="sub">${p}% · Time used ${fmt(taken)}</p><div class="row" style="margin:0 0 12px"><span class="tag ok">${sc} Correct</span><span class="tag no">${Q.length-sc-skipped} Wrong</span><span class="tag skip">${skipped} Not attempted</span></div>
 <div class="row"><button class="btn" id="r">Retake (new order)</button><button class="btn ghost" id="h">All subjects</button></div>
 <h2 style="margin-top:28px;font-size:1.1rem">Review</h2>`+
 Q.map((q,i)=>{const a=ans[i],ok=a===q.a,st=a===null?'skip':ok?'ok':'no',lb={skip:'Not attempted',ok:'Correct',no:'Wrong'}[st];return `<div class="rv ${st}"><span class="tag ${st}">${lb}</span><b>${i+1}. ${q.q}</b><br><small>Your answer: ${a===null?'Not answered':q.o[a]}</small>${ok?'':`<br><small class="g">Correct: ${q.o[q.a]}</small>`}<br><small>${q.e}</small></div>`}).join('');
 document.getElementById('r').onclick=()=>start(name);document.getElementById('h').onclick=home;
 window.scrollTo(0,0);
}
home();
</script></body></html>
